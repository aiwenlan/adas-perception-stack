  <text x="24" y="32" class="t" style="font-size:18px;font-weight:700">BEVFormer：Temporal SA + Spatial CA</text>
  <rect x="30" y="60" width="160" height="70" rx="10" fill="#1e40af"/><text x="48" y="100" class="h">Images 6 cams</text>
  <path d="M190 95 H230" stroke="#64748b" stroke-width="2"/>
  <rect x="230" y="60" width="150" height="70" rx="10" fill="#2563eb"/><text x="248" y="100" class="h">Backbone+FPN</text>
