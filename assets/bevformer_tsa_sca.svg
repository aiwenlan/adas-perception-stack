  <text x="30" y="320" class="s">TSA：历史 BEV 必须先做 Ego Motion Compensation，不能直接相加。</text>
  <text x="30" y="342" class="s">SCA：Reference 在 Ego 3D，投影到可见相机后 deformable 采样，多相机特征聚合回 BEV。</text>
  <text x="30" y="364" class="s">tiny: bev_h=bev_w=50, queue_length=3, num_query=900; mini_val mAP 0.265 / NDS 0.326.</text>
