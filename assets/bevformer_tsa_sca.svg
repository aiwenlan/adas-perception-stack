  <rect x="250" y="170" width="200" height="90" rx="10" fill="#b45309"/><text x="270" y="205" class="h">Temporal SA</text><text x="270" y="228" class="h" style="font-size:11px;font-weight:400">Hist BEV + Ego Motion</text>
  <path d="M210 215 H250" stroke="#64748b" stroke-width="2"/>
